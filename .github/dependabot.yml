version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep security alerts available without flooding a new project with
    # unreviewed version-update pull requests.
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /services/ingest
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

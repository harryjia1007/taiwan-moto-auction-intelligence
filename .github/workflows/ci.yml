name: CI

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
        env:
          TM_FIXTURE_MODE: "true"
      - run: pnpm --filter @tm-ai/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          TM_FIXTURE_MODE: "true"
          OWNER_EMAIL: owner@example.com

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r services/ingest/requirements-dev.lock
      - run: pip install --no-deps -e services/ingest
      - run: pytest services/ingest

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db

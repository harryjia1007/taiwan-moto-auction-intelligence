name: Public data safety boundary

on:
  workflow_dispatch:
  schedule:
    - cron: "25 1,13 * * *"

concurrency:
  group: public-data-safety
  cancel-in-progress: false

jobs:
  sanitize:
    name: 清理未授權公開照片
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate hosted publication credentials
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "Missing SUPABASE_SECRET_KEY (or legacy SUPABASE_SERVICE_ROLE_KEY) repository secret"; exit 1; }
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Enforce empty anonymous photo projection
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data '{"photo_urls":[]}' \
            "$SUPABASE_URL/rest/v1/public_live_motorcycle_listings?id=not.is.null"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

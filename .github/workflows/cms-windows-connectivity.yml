name: CMS Windows connectivity diagnostic

on:
  push:
    branches:
      - codex/official-source-release-20260823
    paths:
      - .github/workflows/cms-windows-connectivity.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: One bounded read of official robots policy
        shell: pwsh
        run: |
          curl.exe --ipv4 --connect-timeout 8 --max-time 12 --max-redirs 0 --silent --show-error --output NUL --write-out "http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" "https://www.tpy.moj.gov.tw/robots.txt"
          exit $LASTEXITCODE
